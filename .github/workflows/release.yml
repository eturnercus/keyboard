name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-evdev squashfs-tools curl \
            build-essential cmake pkg-config g++ \
            libgtk-4-dev libadwaita-1-dev libevdev-dev libatspi2.0-dev
          pip install build pydbus tomli-w

      - name: Build Python packages
        run: |
          bash scripts/build-release.sh
          bash scripts/build-appimage.sh
          file dist/*.AppImage | grep 'ELF.*executable'

      - name: Build C++ and Uninstall AppImages
        run: |
          bash scripts/build-appimage-cpp.sh
          bash scripts/build-appimage-uninstall.sh
          file dist/TouchFlow-Keyboard-Cpp-*.AppImage | grep 'ELF.*executable'
          file dist/TouchFlow-Uninstall-*.AppImage | grep 'ELF.*executable'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## TouchFlow Keyboard 1.0.0

            Надёжная установка: абсолютные пути, touchflow-doctor, AppImage удаления.
            Исправлены crash touchflow-settings (FloatSpinRow) и PATH (~/.local/bin).

            ### Python (production)
            - TouchFlow-Keyboard-1.0.0-*.AppImage — установщик
            - touchflow-install-1.0.0.sh
            - touchflow-settings, touchflow-doctor

            ### C++ (experimental)
            - TouchFlow-Keyboard-Cpp-1.0.0-*.AppImage
            - touchflow-settings-cpp

            ### Удаление
            - TouchFlow-Uninstall-1.0.0-*.AppImage
            - scripts/uninstall.sh

            Документация: README.md (RU), README.en.md (EN)
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.AppImage
            dist/touchflow-install-*.sh
            dist/touchflow-install-cpp-*.sh
            dist/touchflowd-cpp-*
          generate_release_notes: false
